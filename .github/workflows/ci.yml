name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Security & isolation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tenant isolation check (static)
        run: bash scripts/check-tenant-isolation.sh

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend — lint, type-check, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aristotest
          POSTGRES_PASSWORD: aristotest_ci
          POSTGRES_DB: aristotest_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: aristotest_test
      DB_USER: aristotest
      DB_PASSWORD: aristotest_ci
      JWT_SECRET: ci_test_jwt_secret_0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci_test_refresh_secret_0123456789abcdef0123456789abcdef
      SESSION_SECRET: ci_test_session_secret_0123456789abcdef0123456789abcdef
      MINIO_ACCESS_KEY: ci_minio_access
      MINIO_SECRET_KEY: ci_minio_secret
      MINIO_ENDPOINT: localhost
      MINIO_PORT: '9000'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Test
        run: npm test --if-present
        continue-on-error: true

  frontend:
    name: Frontend — lint, type-check, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Build
        run: npm run build
        continue-on-error: true

      - name: Test
        run: npm test --if-present -- --run
        continue-on-error: true
