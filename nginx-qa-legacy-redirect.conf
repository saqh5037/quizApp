# Legacy HTTPS entry for the bare EC2 hostname. No CA issues certificates for
# amazonaws.com hostnames, so browsers still warn once; after that they are sent
# to the real AristoTest hostname instead of the default 443 server (Dominus).
server {
    listen 443 ssl;
    server_name ec2-52-55-189-120.compute-1.amazonaws.com;

    ssl_certificate /etc/letsencrypt/live/aristotest.52-55-189-120.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aristotest.52-55-189-120.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://aristotest.52-55-189-120.sslip.io$request_uri;
}
