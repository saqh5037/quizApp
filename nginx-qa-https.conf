# AristoTest QA — aristotest.52-55-189-120.sslip.io
# Static SPA from frontend/dist; /api and /socket.io proxied to the backend on :3001.
# Based on the dominus template. Certbot adds the 443 block and the 80→443 redirect.

server {
    server_name aristotest.52-55-189-120.sslip.io;

    root /home/dynamtek/aristoTEST/frontend/dist;
    index index.html;

    client_max_body_size 100M;

    access_log /var/log/nginx/aristotest_https_access.log;
    error_log /var/log/nginx/aristotest_https_error.log;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # SPA entry point must never be cached (stale index → old asset hashes after a deploy)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Hashed static assets — long cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API backend
    location /api {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 600;
        proxy_connect_timeout 90;
        proxy_send_timeout 600;
        proxy_buffering off;
    }

    # Socket.io
    location /socket.io {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }

    # SPA routing — must be last
    location / {
        try_files $uri $uri/ /index.html;
    }


    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/aristotest.52-55-189-120.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/aristotest.52-55-189-120.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = aristotest.52-55-189-120.sslip.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    server_name aristotest.52-55-189-120.sslip.io;
    listen 80;
    return 404; # managed by Certbot


}