version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: quiz_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: aristotest
      POSTGRES_PASSWORD: AristoTest2024
      POSTGRES_DB: aristotest
    ports:
      - "5433:5432"
    volumes:
      - quiz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aristotest -d aristotest"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quiz_app_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - quiz_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: quiz_app_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./backend/storage/minio-data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

volumes:
  quiz_postgres_data:
  quiz_redis_data:
  quiz_minio_data:

networks:
  default:
    name: quiz_app_network
